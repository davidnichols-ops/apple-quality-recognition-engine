name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: pip install pyflakes ruff

      - name: Compile check
        run: python -m compileall -q .

      - name: Pyflakes
        run: |
          find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "*/__pycache__/*" \
            -not -path "./dataset/*" \
            -not -path "./.venv/*" \
            -print0 | xargs -0 pyflakes

      - name: Ruff check
        run: ruff check --select F --ignore F401,F841 .
