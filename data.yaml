# Three-class feature detector. Reference grades live in capture metadata,
# not in YOLO labels. Split lists must be generated at profile level so all
# five views of one apple remain in the same partition.

path: ./apple_dataset
train: splits/train.txt
val: splits/val.txt
test: splits/test.txt

nc: 3
names:
  0: apple
  1: unfit_bin_discard
  2: class_defect
