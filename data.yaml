# Plant Health Recognition Engine — 3-tier feature detector schema.
#
# Hierarchy:  plant (parent) → leaf (child instance) → class_defect (grandchild)
#
# Defects bind to leaves via IoA; leaves bind to plants via IoA.
# The deterministic grading engine walks the tree bottom-up:
#   1. grade each leaf from its bound defects (count + coverage)
#   2. grade the plant from the aggregate of leaf grades
#
# Reference health grades (HEALTHY / MODERATE / POOR / DISCARD) live in
# capture metadata, not in YOLO labels.  Annotators box every visible
# defect even on HEALTHY plants so the detector never learns that grade
# controls whether a defect exists.

path: ./plant_dataset
train: images/train
val: images/val
test: images/test

nc: 4
names:
  # --- MACRO PARENT BOX ---
  0: plant

  # --- LEAF INSTANCE (intermediate child) ---
  1: leaf

  # --- DISCARD TRIGGER ---
  2: unfit_discard

  # --- GENERIC DEFECT (grandchild, binds to leaf via IoA) ---
  3: class_defect
