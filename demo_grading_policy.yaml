# Agritech Edge Sandbox - Plant Canopy Audit Policy
facility_id: "LIVING_ROOM_BOTANICAL_CHECK"

severity_mapping:
  # Small overlapping items detected inside the plant's footprint
  mild_defects:
    - "apple"         # YOLO often sees small round leaf spots or fruits as apples
    - "orange"
  moderate_defects:
    - "sports ball"   # Often triggered by round yellowing leaf spots
    - "cup"           # Small traps or tags
  severe_defects:
    - "scissors"      # Pruning damage indicator
    - "bird"          # Active pest infestation
    - "mouse"         # Rodent footprint

rules:
  max_mild_for_g1: 0            # Perfectly pristine canopy
  area_threshold_g3_pct: 12.0   # If anomalies cover >12% of the plant profile
  ioa_binding_threshold: 0.12
